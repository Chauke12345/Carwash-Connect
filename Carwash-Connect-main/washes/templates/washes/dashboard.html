{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <!-- Existing dashboard content -->
    {% if job.vehicle.customer.phone_number %}
    <div class="job-actions">
        {% with phone=job.vehicle.customer.phone_number|cut:'+'|cut:' '|cut:'-'|cut:'('|cut:')' %}
        <a
            href="https://wa.me/{% if phone|slice:':1' == '0' %}27{{ phone|slice:'1:' }}{% elif phone|slice:':2' == '27' %}{{ phone }}{% else %}27{{ phone }}{% endif %}?text=Hello%20{{ job.vehicle.customer|urlencode }}%2C%20your%20{{ job.vehicle.make|urlencode }}%20{{ job.vehicle.model|urlencode }}%20%28Registration%3A%20{{ job.vehicle.registration_number|urlencode }}%29%20has%20been%20completed%20and%20is%20ready%20for%20collection%20at%20{{ job.car_wash|urlencode }}.%20Service%3A%20{{ job.service|urlencode }}.%20Amount%3A%20R{{ job.amount }}.%20Thank%20you."
            target="_blank"
            rel="noopener"
            class="btn btn-whatsapp"
        >
            WhatsApp Customer
        </a>
        {% endwith %}
    </div>
    {% endif %}
</div>
{% endblock %}
