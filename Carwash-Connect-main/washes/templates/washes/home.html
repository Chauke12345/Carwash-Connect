{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CarWash Connect</title>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'washes/images/carwash-icon-192.png' %}"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        .homepage {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #ffffff;
        }

        .homepage-image {
            position: relative;
            width: 100%;
            max-width: 1648px;
            line-height: 0;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 20, 50, 0.16);
        }

        .homepage-image img {
            display: block;
            width: 100%;
            height: auto;
        }


        /* =====================================================
           INVISIBLE FUNCTIONAL BUTTONS
        ===================================================== */

        .home-link {
            position: absolute;
            display: block;
            z-index: 10;
            background: transparent;
        }

        /*
         * Staff Login in the supplied image
         */
        .staff-login-link {
            left: 72.5%;
            top: 2.5%;
            width: 9.5%;
            height: 5.5%;
        }

        /*
         * Platform Admin in the supplied image
         */
        .platform-login-link {
            left: 83%;
            top: 2.5%;
            width: 10.5%;
            height: 5.5%;
        }

        /*
         * Hero Staff Login button
         */
        .hero-login-link {
            left: 5%;
            top: 46%;
            width: 14%;
            height: 7%;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .homepage-image {
                border-radius: 0;
                box-shadow: none;
            }

            .staff-login-link {
                left: 72%;
                top: 2%;
                width: 11%;
                height: 6%;
            }

            .platform-login-link {
                left: 83%;
                top: 2%;
                width: 12%;
                height: 6%;
            }

            .hero-login-link {
                left: 5%;
                top: 46%;
                width: 18%;
                height: 8%;
            }

        }

    </style>

</head>


<body>


<div class="homepage">

    <div class="homepage-image">

        <img
            src="{% static 'washes/images/carwash-homepage.png' %}"
            alt="CarWash Connect"
        >


        <!-- ===============================================
             STAFF LOGIN
        ================================================ -->

        <a
            href="{% url 'staff_login' %}"
            class="home-link staff-login-link"
            aria-label="Staff Login"
            title="Staff Login"
        ></a>


        <!-- ===============================================
             PLATFORM ADMIN
        ================================================ -->

        <a
            href="{% url 'platform_login' %}"
            class="home-link platform-login-link"
            aria-label="Platform Admin"
            title="Platform Admin"
        ></a>


        <!-- ===============================================
             HERO STAFF LOGIN
        ================================================ -->

        <a
            href="{% url 'staff_login' %}"
            class="home-link hero-login-link"
            aria-label="Staff Login"
            title="Staff Login"
        ></a>

    </div>

</div>


</body>

</html>
